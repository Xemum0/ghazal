components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: ES256 access token, 10 minutes. The partner context is chosen by X-Venue-Id or X-Provider-Id.
  schemas:
    Id:
      type: string
      description: Opaque id (fixtures use readable ids such as V01 or vch-GV-2611-K7QM; production uses UUIDs).
      x-tag: common
    IsoDate:
      type: string
      format: date
      description: Kuwait civil date YYYY-MM-DD. Never converted between time zones.
      x-tag: common
    IsoDateTime:
      type: string
      format: date-time
      description: Instant with an explicit offset, normally +03:00 (Asia/Kuwait, no DST).
      x-tag: common
    LocalTime:
      type: string
      format: local-time
      pattern: ^([01]\d|2[0-3]):[0-5]\d$
      description: Venue-local HH:mm, 24 hour. A session that ends before it starts crosses midnight.
      x-tag: common
    Weekday:
      type: integer
      minimum: 0
      maximum: 6
      description: 0 = Sunday ... 6 = Saturday (ADR 0011).
      x-tag: common
    Money:
      type: object
      description: Integer fils plus currency (ADR 0010). KWD has 3 decimals, 1 KD = 1000 fils. Never formatted by the server.
      required:
        - fils
        - currency
      properties:
        fils:
          type: integer
        currency:
          type: string
          enum:
            - KWD
      x-tag: common
    LocalizedText:
      type: object
      description: Authored text in both languages; a missing language is null and the client falls back to the other one.
      required:
        - en
        - ar
      properties:
        en:
          type:
            - string
            - "null"
        ar:
          type:
            - string
            - "null"
      x-tag: common
    Lang:
      x-dart-name: WireLang
      type: string
      enum:
        - en
        - ar
      x-tag: common
    Audience:
      type: string
      enum:
        - women
        - men
        - mixed
      x-tag: common
    LatLng:
      type: object
      required:
        - lat
        - lng
      properties:
        lat:
          type: number
        lng:
          type: number
      x-tag: common
    MediaZone:
      type: string
      enum:
        - hall
        - stage_kosha
        - bridal_suite
        - buffet
        - outdoors
        - entrance_valet
        - layout
      x-tag: common
    ImageRef:
      type: object
      description: >-
        A photograph. Mock mode resolves `file` against the bundled library; the real API sets `baseUrl` and the client appends
        `/{width}.webp` (320, 640, 960, 1440).
      required:
        - file
        - width
        - height
        - orientation
        - alt
      properties:
        id:
          $ref: "#/components/schemas/Id"
        file:
          type: string
        baseUrl:
          type:
            - string
            - "null"
        width:
          type: integer
        height:
          type: integer
        orientation:
          type: string
          enum:
            - landscape
            - portrait
        aspect:
          type: number
        blurhash:
          type:
            - string
            - "null"
        alt:
          $ref: "#/components/schemas/LocalizedText"
      x-tag: common
    GalleryItem:
      allOf:
        - $ref: "#/components/schemas/ImageRef"
        - type: object
          required:
            - zone
          properties:
            zone:
              $ref: "#/components/schemas/MediaZone"
            hallId:
              oneOf:
                - $ref: "#/components/schemas/Id"
                - type: "null"
      x-tag: common
    FaqItem:
      type: object
      required:
        - id
        - question
        - answer
      properties:
        id:
          $ref: "#/components/schemas/Id"
        question:
          $ref: "#/components/schemas/LocalizedText"
        answer:
          $ref: "#/components/schemas/LocalizedText"
      x-tag: common
    RatingSummary:
      type: object
      description: "A venue with no reviews has `average: null` and `count: 0` and shows New, never 0.0."
      required:
        - average
        - count
        - categories
      properties:
        average:
          type:
            - number
            - "null"
        count:
          type: integer
        categories:
          oneOf:
            - $ref: "#/components/schemas/RatingCategories"
            - type: "null"
      x-tag: common
    RatingCategories:
      type: object
      required:
        - venue
        - food
        - service
        - value
      properties:
        venue:
          type: number
        food:
          type: number
        service:
          type: number
        value:
          type: number
      x-tag: common
    Distance:
      type: object
      required:
        - km
        - minutes
      properties:
        km:
          type: number
        minutes:
          type: integer
      x-tag: common
    FieldError:
      type: object
      required:
        - path
        - code
      properties:
        path:
          type: string
        code:
          type: string
        params:
          type: object
          additionalProperties: true
      x-tag: common
    SlotAlternative:
      type: object
      required:
        - eventDate
      properties:
        eventDate:
          $ref: "#/components/schemas/IsoDate"
        hallId:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
      x-tag: common
    ErrorCode:
      type: string
      description: Stable error codes. Generated from `x-error-codes` of base.yaml by the bundler. Unknown values must be tolerated.
      enum:
        - VALIDATION_FAILED
        - AUTH_REQUIRED
        - TOKEN_EXPIRED
        - SESSION_REVOKED
        - PHONE_VERIFICATION_REQUIRED
        - FORBIDDEN
        - STEP_UP_REQUIRED
        - NOT_FOUND
        - VENUE_CONTEXT_REQUIRED
        - OTP_INVALID
        - OTP_EXPIRED
        - OTP_LOCKED
        - CREDENTIALS_INVALID
        - RATE_LIMITED
        - IDEMPOTENCY_KEY_REUSED
        - IDEMPOTENCY_IN_PROGRESS
        - PRECONDITION_FAILED
        - BOOKING_STATE_CONFLICT
        - SLOT_UNAVAILABLE
        - OPEN_REQUEST_LIMIT
        - QUOTE_EXPIRED
        - QUOTE_CHANGED
        - LEAD_TIME_TOO_SHORT
        - GUESTS_OUT_OF_RANGE
        - AUDIENCE_NOT_ALLOWED
        - CHANNEL_NOT_BOOKABLE
        - VOUCHER_NOT_OFFERED
        - VOUCHER_NOT_USABLE
        - VOUCHER_TARGET_MISMATCH
        - VOUCHER_CHECKOUT_EXPIRED
        - VOUCHER_UNKNOWN
        - VOUCHER_OTHER_PARTNER
        - VOUCHER_NOT_CONFIRMED
        - VOUCHER_ALREADY_USED
        - CREDIT_NOT_ELIGIBLE
        - REFUND_REQUEST_EXISTS
        - CONFIRM_WINDOW_ENDED
        - UNDO_WINDOW_ENDED
        - PAYMENT_GATEWAY_ERROR
        - PLAN_RATES_NOT_ANNOUNCED
        - LISTING_NOT_EDITABLE
        - LISTING_STATE_CONFLICT
        - MEDIA_TOO_LARGE
        - MEDIA_TYPE_UNSUPPORTED
        - REVIEW_ALREADY_REPLIED
        - REVIEW_NOT_ALLOWED
        - VISIT_SLOT_TAKEN
        - VISIT_NOT_ALLOWED
        - VISIT_STATE_CONFLICT
        - STAFF_LAST_ADMIN
        - INVITATION_EXPIRED
        - EMAIL_ALREADY_INVITED
        - ACCOUNT_DELETION_BLOCKED
        - APP_UPDATE_REQUIRED
      x-tag: common
    Problem:
      type: object
      description: RFC 9457 problem+json. `title` and `detail` are for developers; clients map `code` plus `params` to a localised string.
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
        title:
