# The signed-in person: profile, settings, devices, phone change, account deletion.
UserRole: { type: string, enum: [client, hotel_staff, provider_staff, planner, support] }
DigitStyle: { type: string, enum: [western, easternArabic], x-dart-name: WireDigitStyle }
Sex:
  type: string
  enum: [female, male]
  description: 'Sex of a client account (ADR 0038 D4, CA-AUTH-14, OQ-R2-02). Required when a client account is completed (`registerAccount`, `completeProfile`), editable with `updateMe`. Stored on the account; not shown to venues and not used to filter yet.'
User:
  type: object
  required: [id, role, name, monogram, phone, email, locale, digitStyle, createdAt]
  properties:
    id: { $ref: Id }
    role: { $ref: UserRole }
    name: { type: string, description: 'Name as typed (stored as typed, rendered with dir=auto).' }
    nameLatin: { type: string, nullable: true }
    monogram: { type: string }
    phone: { type: string, description: E.164 for clients; display value for staff. }
    email: { type: string, nullable: true }
    locale: { $ref: Lang }
    digitStyle: { $ref: DigitStyle }
    sex: { $ref: Sex, nullable: true, description: 'Clients: `female` or `male`, set when the account is completed (null only on an account that has not finished "About you" yet, and on staff and support accounts).' }
    createdAt: { $ref: IsoDateTime }
Me:
  type: object
  description: The profile plus what the apps hide or show. `permissions` lists the permission keys of the active partner context (empty for clients).
  required: [user, permissions, phoneVerified, emailVerified, hasPassword, marketingOptIn]
  properties:
    user: { $ref: User }
    permissions: { type: array, items: { type: string } }
    phoneVerified: { type: boolean }
    emailVerified: { type: boolean }
    hasPassword: { type: boolean }
    marketingOptIn: { type: boolean }
UpdateMeInput:
  type: object
  description: Partial update. Changing the phone goes through the phone-change operations.
  properties:
    name: { type: string }
    email: { type: string, format: email, nullable: true }
    locale: { $ref: Lang }
    digitStyle: { $ref: DigitStyle }
    sex: { $ref: Sex }
    marketingOptIn: { type: boolean }
CompleteProfileInput:
  type: object
  description: 'Finishes a brand-new client account after the first code (CL-AUTH-03 "About you", CA-AUTH-14): name and sex are required, then the Terms and Privacy acceptance. Until it succeeds `AuthSession.isNewUser` stays true on every sign-in of that number.'
  required: [name, sex, acceptedTerms]
  properties:
    name: { type: string, minLength: 1, description: 'Name as typed (stored as typed).' }
    sex: { $ref: Sex }
    acceptedTerms: { type: boolean, enum: [true] }
    email: { type: string, format: email, nullable: true }
DevicePlatform: { type: string, enum: [ios, android, web] }
DeviceRegistration:
  type: object
  required: [platform, locale]
  properties:
    platform: { $ref: DevicePlatform }
    pushToken: { type: string, nullable: true }
    locale: { $ref: Lang }
    appVersion: { type: string, nullable: true }
PhoneChangeInput:
  type: object
  required: [phone]
  properties: { phone: { $ref: Phone } }
PhoneVerifyInput:
  type: object
  required: [challengeId, code]
  properties: { challengeId: { type: string }, code: { type: string } }
AccountDeletionStatus:
  type: object
  required: [status, effectiveAt]
  properties:
    status: { type: string, enum: [scheduled] }
    effectiveAt: { $ref: IsoDateTime, description: 'Personal data is anonymised then; ledger and receipt rows are kept.' }
