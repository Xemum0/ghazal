<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghazal · Font lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Serif:wght@300;400&family=Readex+Pro:wght@300;400;500;600&family=El+Messiri:wght@400;500;600&family=Almarai:wght@300;400;700&family=Manrope:wght@300;400;500;600&family=Tajawal:wght@300;400;500;700&family=DM+Sans:wght@300;400;500;600&family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Noto+Naskh+Arabic:wght@400;500;600&family=Cormorant+Garamond:wght@300;400;500&family=Noto+Sans+Arabic:wght@300;400;500;600&family=Figtree:wght@300;400;500;600&family=Alexandria:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --ink:#2E2528; --ink2:#5A4B4F; --gold:#D8B26E; --canvas:#FFF9F5; --rose:#F8E7EC; --line:#E3DAD7; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--canvas); color:var(--ink); font:15px/1.5 system-ui; padding:32px 24px 64px; }
  h1 { font:500 20px/1.3 system-ui; margin:0 0 4px; } .sub { color:var(--ink2); margin:0 0 28px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(520px,1fr)); gap:24px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:20px; }
  .tag { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px; font:600 13px system-ui; letter-spacing:.04em; text-transform:uppercase; color:var(--ink2); }
  .tag b { color:var(--ink); font-size:15px; } .fonts { font:12px system-ui; color:#8A7A7E; text-transform:none; letter-spacing:0; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  .col { border-radius:10px; padding:16px; background:var(--canvas); }
  .col[dir=rtl] { text-align:start; }
  .d1 { font-size:30px; line-height:1.2; margin:0 0 10px; } .ar .d1 { font-size:32px; line-height:1.5; }
  .meta { color:var(--ink2); font-size:14px; margin:0 0 12px; } .ar .meta { font-size:15px; line-height:1.7; }
  .price { font-size:20px; font-weight:500; margin:0 0 12px; } .price small { font-size:13px; color:var(--ink2); font-weight:400; }
  .body { font-size:15px; line-height:1.6; margin:0 0 14px; } .ar .body { font-size:16px; line-height:1.85; }
  .btn { display:block; text-align:center; background:var(--gold); color:var(--ink); border-radius:8px; padding:14px; font-weight:500; font-size:16px; }
  .pill { display:inline-block; margin-block-start:10px; padding:4px 10px; border-radius:999px; background:var(--rose); font-size:13px; color:var(--ink2); }
  /* pairings */
  .p1 .en { font-family:'IBM Plex Sans',sans-serif; } .p1 .en .d1 { font-family:'IBM Plex Serif',serif; font-weight:300; }
  .p1 .ar { font-family:'IBM Plex Sans Arabic',sans-serif; } .p1 .ar .d1 { font-weight:300; }
  .p2 .en, .p2 .ar { font-family:'Readex Pro',sans-serif; } .p2 .d1 { font-weight:300; }
  .p3 .en { font-family:'Manrope',sans-serif; } .p3 .en .d1 { font-family:'El Messiri',serif; font-weight:500; }
  .p3 .ar { font-family:'Almarai',sans-serif; } .p3 .ar .d1 { font-family:'El Messiri',serif; font-weight:500; }
  .p4 .en { font-family:'DM Sans',sans-serif; } .p4 .en .d1 { font-family:'Fraunces',serif; font-weight:300; }
  .p4 .ar { font-family:'Tajawal',sans-serif; } .p4 .ar .d1 { font-weight:300; }
  .p5 .en { font-family:'Figtree',sans-serif; } .p5 .en .d1 { font-family:'Cormorant Garamond',serif; font-weight:400; font-size:36px; }
  .p5 .ar { font-family:'Noto Sans Arabic',sans-serif; } .p5 .ar .d1 { font-family:'Noto Naskh Arabic',serif; font-weight:500; }
  .p6 .en, .p6 .ar { font-family:'Alexandria',sans-serif; } .p6 .d1 { font-weight:300; }
  .cur .en { font-family:'Poppins',sans-serif; } .cur .ar { font-family:'Cairo',sans-serif; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&family=Cairo:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<h1>Ghazal · Font lab</h1>
<p class="sub">Same content in six pairings (plus the current one for reference). Each shows a headline, venue meta, price, body copy and a button, in English and Arabic.</p>
<div class="grid" id="g"></div>
<script>
const P = [
 ['cur','Current (for reference)','Newsreader + Poppins / Amiri + Cairo'],
 ['p1','A · Plex','IBM Plex Serif + Sans / IBM Plex Sans Arabic'],
 ['p2','B · Readex','Readex Pro (one family, both scripts)'],
 ['p3','C · Messiri','El Messiri headlines + Manrope / Almarai'],
 ['p4','D · Tajawal','Fraunces + DM Sans / Tajawal'],
 ['p5','E · Classic','Cormorant Garamond + Figtree / Noto Naskh + Noto Sans Arabic'],
 ['p6','F · Alexandria','Alexandria (one family, both scripts)'],
];
const en = `<h2 class="d1">The room for your evening</h2><p class="meta">Aurelia Gulf Hotel · Sharq · 200–650 guests</p><p class="price">KD 18,200 <small>for 350 guests · Thu 14 Jan 2027</small></p><p class="body">Marble floors, a double-height ballroom and a private bridal suite. Nothing is charged until the hotel approves your request.</p><span class="btn">Request this date</span><span class="pill">Available · 3 halls</span>`;
const ar = `<h2 class="d1">القاعة التي تليق بليلتكم</h2><p class="meta">فندق أوريليا الخليج · شرق · ٢٠٠–٦٥٠ مدعو</p><p class="price">١٨٬٢٠٠ د.ك <small>لـ ٣٥٠ مدعواً · الخميس ١٤ يناير ٢٠٢٧</small></p><p class="body">أرضيات رخامية، قاعة بارتفاع مزدوج وجناح خاص للعروس. لا يُحتسب أي مبلغ حتى يوافق الفندق على طلبكم.</p><span class="btn">اطلب هذا التاريخ</span><span class="pill">متاح · ٣ قاعات</span>`;
g.innerHTML = P.map(([c,t,f]) => `<section class="card ${c}"><div class="tag"><b>${t}</b><span class="fonts">${f}</span></div><div class="row"><div class="col en" lang="en" dir="ltr">${en}</div><div class="col ar" lang="ar" dir="rtl">${ar.replace(/[٠-٩]/g,d=>'0123456789'[d.charCodeAt(0)-1632])}</div></div></section>`).join('');
</script>
</body>
</html>
