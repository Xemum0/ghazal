# The Partner app account: sessions, account type, context (venue or provider), staff and email invitations (ADR 0035 D8).
StaffRole: { type: string, enum: [admin, manager, reception, accountant, marketing] }
StaffStatus: { type: string, enum: [active, invited, deactivated] }
PartnerAccountType: { type: string, enum: [venue, service_provider], description: 'Hotel or wedding hall, or service provider.' }
PartnerAccountStatus: { type: string, enum: [invited, active, under_review, suspended], description: '`under_review` covers an application that is pending or rejected (`application.status` tells which); `active` once it is accepted or for an account Ghazal assigned.' }
ApplicationStatus: { type: string, enum: [pending, accepted, rejected], description: 'Staff decision on a partner application (PA-ACC-07). A resubmission sets it to `pending` again.' }
PartnerApplication:
  type: object
  description: 'The application a service provider or private hall sends from the Partner app (HL-PROV-01, PA-ACC-07, PA-ACC-08, OQ-R2-03). Ghazal staff accept or reject it in the Super Admin web (not in this API; the mock has a control endpoint); only an accepted account can create listings. Visible to the applicant through `PartnerMe.memberships[].application` and `PartnerAccount.application`.'
  required: [id, accountId, accountType, name, categoryIds, otherCategoryNote, governorateId, contactName, phone, email, description, licenceRef, status, rejectionReason, submittedAt, decidedAt]
  properties:
    id: { $ref: Id }
    accountId: { $ref: Id }
    accountType: { $ref: PartnerAccountType }
    name: { $ref: LocalizedText, description: 'Business name in Arabic and English.' }
    categoryIds: { type: array, items: { $ref: ServiceCategoryId }, maxItems: 3, description: 'Up to three registered service categories (a service provider; empty for a private hall).' }
    otherCategoryNote: { type: string, nullable: true, description: 'Open note for a service that is not among the registered categories ("Other"); staff can add the category or reject (PA-ACC-08).' }
    governorateId: { $ref: Id, description: 'From `GET /areas`.' }
    contactName: { type: string }
    phone: { $ref: Phone }
    email: { type: string }
    description: { type: string, description: 'Short description, as typed.' }
    licenceRef: { type: string, nullable: true, description: 'Optional commercial licence reference.' }
    status: { $ref: ApplicationStatus }
    rejectionReason: { $ref: LocalizedText, nullable: true, description: 'Set with a rejection; shown to the applicant with "Edit and resubmit".' }
    submittedAt: { $ref: IsoDateTime, description: 'The first submission, or the last resubmission.' }
    decidedAt: { $ref: IsoDateTime, nullable: true }
PartnerApplicationInput:
  type: object
  description: 'The business information of the application form. Categories are up to three registered ids plus the open note; a service provider needs at least one of the two.'
  required: [name, governorateId, contactName, phone, email, description]
  properties:
    name: { $ref: LocalizedText }
    categoryIds: { type: array, items: { $ref: ServiceCategoryId }, maxItems: 3 }
    otherCategoryNote: { type: string, nullable: true, maxLength: 300 }
    governorateId: { $ref: Id }
    contactName: { type: string, minLength: 1 }
    phone: { $ref: Phone }
    email: { type: string, format: email }
    description: { type: string, minLength: 1, maxLength: 600 }
    licenceRef: { type: string, nullable: true, maxLength: 80 }
PartnerAccount:
  type: object
  required: [id, type, name, venueIds, providerId, ownerUserId, feeExempt, status, createdAt]
  properties:
    id: { $ref: Id }
    type: { $ref: PartnerAccountType }
    name: { $ref: LocalizedText }
    venueIds: { type: array, items: { $ref: Id } }
    providerId: { $ref: Id, nullable: true }
    ownerUserId: { $ref: Id, nullable: true }
    feeExempt: { type: boolean, description: Major hotel; set only by the Super Admin and never visible to clients. }
    status: { $ref: PartnerAccountStatus }
    application: { $ref: PartnerApplication, nullable: true, description: 'The application of an account that joined with the form; null for an account Ghazal assigned (those are accepted).' }
    createdAt: { $ref: IsoDateTime }
PartnerContext:
  type: object
  required: [accountId, venueId, providerId]
  properties:
    accountId: { $ref: Id }
    venueId: { $ref: Id, nullable: true }
    providerId: { $ref: Id, nullable: true }
PartnerMembership:
  type: object
  description: One account and target the signed-in person works for, with their role and permission keys there.
  required: [accountId, accountType, accountName, venueId, providerId, role, permissions, pendingRequests, feeExempt, status]
  properties:
    accountId: { $ref: Id }
    accountType: { $ref: PartnerAccountType }
    accountName: { $ref: LocalizedText }
    venueId: { $ref: Id, nullable: true }
    providerId: { $ref: Id, nullable: true }
    role: { $ref: StaffRole }
    permissions: { type: array, items: { type: string }, description: 'Permission keys such as booking:approve. The apps hide what is missing; the server stays the authority.' }
    pendingRequests: { type: integer }
    feeExempt: { type: boolean }
    status: { $ref: PartnerAccountStatus }
    application: { $ref: PartnerApplication, nullable: true, description: 'Present for an account that joined with the application form (pending, accepted or rejected, with the rejection reason).' }
PartnerMe:
  type: object
  required: [user, memberships, active]
  properties:
    user: { $ref: User }
    memberships: { type: array, items: { $ref: PartnerMembership } }
    active: { $ref: PartnerContext, nullable: true }
ChooseAccountTypeInput:
  type: object
  description: 'First sign-in of a partner without a pre-assigned account: the application form (HL-PROV-01, PA-ACC-07). Creates the account `under_review` with an application `pending`. `accountType` is `service_provider` or `venue` (a private hall). Besides `accountType` and `name` (the business name in both languages) the form carries governorateId, contactName, phone, email and description, plus for a service provider at least one of categoryIds (up to three) and otherCategoryNote; the fields are optional in the schema so older callers still compile, and a missing one is 422 VALIDATION_FAILED with `errors: [{path: "/governorateId", code: "required"}, ...]`.'
  required: [accountType, name]
  properties:
    accountType: { $ref: PartnerAccountType }
    name: { $ref: LocalizedText }
    categoryIds: { type: array, items: { $ref: ServiceCategoryId }, maxItems: 3 }
    otherCategoryNote: { type: string, nullable: true, maxLength: 300 }
    governorateId: { $ref: Id }
    contactName: { type: string }
    phone: { $ref: Phone }
    email: { type: string, format: email }
    description: { type: string, maxLength: 600 }
    licenceRef: { type: string, nullable: true, maxLength: 80 }
SwitchContextInput:
  type: object
  required: [accountId]
  properties:
    accountId: { $ref: Id }
    venueId: { $ref: Id, nullable: true }
    providerId: { $ref: Id, nullable: true }
StaffMember:
  type: object
  required: [id, userId, venueId, name, nameLatin, monogram, role, roleLabel, roleSummary, phone, status, uiLang, lastSeenAt, invitedAt, inviteExpiresAt, invitedBy, isYou]
  properties:
    id: { $ref: Id }
    userId: { $ref: Id }
    venueId: { $ref: Id, description: The venue (or provider) the membership belongs to. }
    name: { type: string }
    nameLatin: { type: string }
    monogram: { type: string }
    email: { type: string, nullable: true }
    role: { $ref: StaffRole }
    roleLabel: { $ref: LocalizedText }
    roleSummary: { $ref: LocalizedText }
    phone: { type: string }
    status: { $ref: StaffStatus }
    uiLang: { $ref: Lang }
    lastSeenAt: { $ref: IsoDateTime, nullable: true }
    invitedAt: { $ref: IsoDateTime, nullable: true }
    inviteExpiresAt: { $ref: IsoDateTime, nullable: true }
    invitedBy: { type: string, nullable: true }
    invitedByName: { $ref: LocalizedText, nullable: true, description: 'The inviter in both languages (Arabic name, Latin name); `invitedBy` stays the Latin name.' }
    isYou: { type: boolean }
InvitationStatus: { type: string, enum: [invited, accepted] }
StaffInvitation:
  type: object
  description: Invitations go by email through Resend, never by WhatsApp.
  required: [id, venueId, email, role, status, sentAt, expiresAt, invitedBy, staffId]
  properties:
    id: { $ref: Id }
    venueId: { $ref: Id }
    email: { type: string }
    role: { $ref: StaffRole }
    status: { $ref: InvitationStatus }
    sentAt: { $ref: IsoDateTime }
    expiresAt: { $ref: IsoDateTime, nullable: true }
    invitedBy: { type: string }
    invitedByName: { $ref: LocalizedText, nullable: true, description: The inviter in both languages. }
    staffId: { $ref: Id, nullable: true }
StaffList:
  type: object
  required: [staff, invitations]
  properties:
    staff: { type: array, items: { $ref: StaffMember } }
    invitations: { type: array, items: { $ref: StaffInvitation } }
InviteStaffInput:
  type: object
  required: [email, role]
  properties:
    email: { type: string, format: email }
    role: { $ref: StaffRole }
ChangeStaffRoleInput:
  type: object
  required: [role]
  properties: { role: { $ref: StaffRole } }
PartnerNotificationPreferences:
  type: object
  required: [newRequestAlwaysOn, messages, reviews, vouchers, visits]
  properties:
    newRequestAlwaysOn: { type: boolean, description: New requests always notify; the value is informational and cannot be turned off. }
    messages: { type: boolean }
    reviews: { type: boolean }
    vouchers: { type: boolean }
    visits: { type: boolean }
