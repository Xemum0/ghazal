name: ghazal_app_kit
description: Shared app shell of the two Ghazal apps - bootstrap, repository and session providers, go_router adapter of GzNavigator, tab shell, demo tools.
publish_to: none
resolution: workspace
environment:
  sdk: ^3.13.4
  flutter: '>=3.47.5 <3.48.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.11.1
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  ghazal_api: any
  ghazal_core: any
  ghazal_domain: any
  ghazal_mock_api: any
  ghazal_ui: any
  go_router: ^18.1.1
  intl: ^0.20.3
  meta: ^1.19.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  ghazal_testing: any
  mocktail: ^1.0.5
