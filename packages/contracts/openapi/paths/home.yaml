/home:
  get:
    operationId: getHome
    summary: Composed home feed (CA-HOME)
    description: 'Brief-aware shelves, the status card, live free count and unread count in one response. `governorateIds` is the Brief''s governorate list (CA-FLT-08): it narrows the `free` shelf, the free count and the nearest free dates; empty or missing = all governorates. `areaIds` (the older Brief areas) keeps working and is deprecated; when both are sent a venue must match both. With no Brief field in the query the signed-in couple''s wedding profile is the Brief.'
    x-access: optional
    query: { date: IsoDate, guests: integer, audience: Audience, governorateIds: 'Id[]', areaIds: 'Id[]', budgetMin: integer, budgetMax: integer, originId: Id }
    responses: { 200: HomeFeed }
/config:
  get:
    operationId: getAppConfig
    summary: Platform configuration, server clock and occasions
    x-access: guest
    x-roles: [client, partner]
    responses: { 200: AppConfig }
/events:
  post:
    operationId: ingestEvents
    summary: Analytics batch (at most 20 events, at-least-once, deduplicated on eventId)
    x-access: optional
    x-roles: [client, partner]
    body: AnalyticsBatch
    responses: { 202: AnalyticsAccepted }
