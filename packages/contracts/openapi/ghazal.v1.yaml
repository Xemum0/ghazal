  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        UUID generated when the user taps the CTA and kept until the outcome is known; a user-initiated retry reuses it (api-conventions
        section 7). Stored 24 h.
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: >-
        The `ETag` of the document being changed (for example `"v7"`). A stale value answers 412 PRECONDITION_FAILED (or 409
        BOOKING_STATE_CONFLICT for requests).
      schema:
        type: string
    XVenueId:
      name: X-Venue-Id
      in: header
      required: false
      description: Active venue of a hotel or hall account. Membership is validated on every call. Send this or X-Provider-Id.
      schema:
        type: string
    XProviderId:
      name: X-Provider-Id
      in: header
      required: false
      description: Active provider of a service-provider account. Send this or X-Venue-Id.
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from `nextCursor` of the previous page.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: Page size (default 20, max 50).
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
  responses:
    Problem:
      description: Unexpected error (problem+json).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
x-error-codes:
  VALIDATION_FAILED:
    status: 422
    summary: Body or query invalid
  AUTH_REQUIRED:
    status: 401
    summary: Gated route without a valid session
  TOKEN_EXPIRED:
    status: 401
    summary: Access token expired
  SESSION_REVOKED:
    status: 401
    summary: Refresh token reused or session revoked
  PHONE_VERIFICATION_REQUIRED:
    status: 403
    summary: Request
    payment or chat without a verified phone: null
  FORBIDDEN:
    status: 403
    summary: Role lacks the permission
  STEP_UP_REQUIRED:
    status: 403
    summary: Staff
    listing-fee or sensitive action needs a fresh code or password: null
  NOT_FOUND:
    status: 404
    summary: Unknown or inaccessible resource
  VENUE_CONTEXT_REQUIRED:
    status: 400
    summary: Partner call without X-Venue-Id or X-Provider-Id
  OTP_INVALID:
    status: 400
    summary: Wrong code
  OTP_EXPIRED:
    status: 410
    summary: Code too old
  OTP_LOCKED:
    status: 423
    summary: Attempts exhausted
  CREDENTIALS_INVALID:
    status: 401
    summary: Wrong identifier or password (identical for unknown accounts)
  RATE_LIMITED:
    status: 429
    summary: Over a limit (Retry-After)
  IDEMPOTENCY_KEY_REUSED:
    status: 422
    summary: Same key with a different body
  IDEMPOTENCY_IN_PROGRESS:
    status: 409
    summary: Original call still running
  PRECONDITION_FAILED:
    status: 412
    summary: If-Match did not match the current ETag
  BOOKING_STATE_CONFLICT:
    status: 409
    summary: Compare-and-swap lost; body carries currentStatus and currentVersion
  SLOT_UNAVAILABLE:
    status: 409
    summary: Date or session not available (booked
    blocked: null
    held); body carries alternatives: null
  OPEN_REQUEST_LIMIT:
    status: 409
    summary: Already 3 open requests (pending plus approved)
  QUOTE_EXPIRED:
    status: 410
    summary: Quote stale
  QUOTE_CHANGED:
    status: 409
    summary: Quote repriced since it was shown
  LEAD_TIME_TOO_SHORT:
    status: 422
    summary: Event date inside the minimum lead time
  GUESTS_OUT_OF_RANGE:
    status: 422
    summary: Guests outside the package or hall range
  AUDIENCE_NOT_ALLOWED:
    status: 422
    summary: Audience not allowed by the hall
  CHANNEL_NOT_BOOKABLE:
    status: 409
    summary: Governmental facility (official channel only)
  VOUCHER_NOT_OFFERED:
    status: 409
    summary: The saving does not beat the voucher fee for this quote
  VOUCHER_NOT_USABLE:
    status: 409
    summary: Voucher is not active
    expired: null
    forfeited or already bound: null
  VOUCHER_TARGET_MISMATCH:
    status: 409
    summary: Voucher is bound to another venue or provider
  VOUCHER_CHECKOUT_EXPIRED:
    status: 409
    summary: Checkout lapsed after 30 minutes unpaid
  VOUCHER_UNKNOWN:
    status: 404
    summary: Redeem code not found
  VOUCHER_OTHER_PARTNER:
    status: 409
    summary: Voucher belongs to another venue or provider
  VOUCHER_NOT_CONFIRMED:
    status: 409
    summary: Client has not confirmed the request yet
  VOUCHER_ALREADY_USED:
    status: 409
    summary: Voucher already redeemed
  CREDIT_NOT_ELIGIBLE:
    status: 409
    summary: Voucher is not eligible for a credit voucher request
  REFUND_REQUEST_EXISTS:
    status: 409
    summary: A refund request for this voucher already exists
  CONFIRM_WINDOW_ENDED:
    status: 409
    summary: The 24 h confirm window passed
  UNDO_WINDOW_ENDED:
    status: 409
    summary: The 8 s approval undo window passed
  PAYMENT_GATEWAY_ERROR:
