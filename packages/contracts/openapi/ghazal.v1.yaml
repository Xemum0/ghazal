info:
  title: Ghazal API
  version: 1.0.0
  summary: Contract of the Ghazal wedding marketplace (voucher model, ADR 0033 and 0035).
  description: >
    One backend for the Client app and the Partner app (hotels, wedding halls and service providers). Ghazal sells one thing in the app,

    a KD 2 voucher; prices, contracts and payment between client and partner are off-app. Conventions: docs/architecture/api-conventions.md.


    * Base path `/v1`, JSON UTF-8, `camelCase` properties, lowercase `snake_case` enum values, ids are opaque strings.

    * Auth: bearer JWT (ES256, 10 min) plus rotating refresh token. Guests may call the operations marked `x-access: guest | optional`.

    * Money is `{ fils, currency }` with integer fils, never formatted by the server. Civil dates are `YYYY-MM-DD` (Kuwait), instants are
      ISO 8601 with the `+03:00` offset (Asia/Kuwait has no DST). Venue-authored text is `{ en, ar }`.
    * Errors are RFC 9457 problem+json with a stable `code` (see `x-error-codes`); the API sends no user-facing prose.

    * Lists are cursor pages `{ items, nextCursor }`. Mutating POSTs that spend money, claim a slot or change a request take an
      `Idempotency-Key`. Concurrency-controlled documents use `ETag` and `If-Match`.
    * Realtime chat (Socket.IO) is outside OpenAPI: see docs/architecture/backend-handoff.md. The REST chat endpoints are the fallback and
    the mock.
