# One analysis configuration for the whole Dart workspace (members inherit it; they have no analysis_options.yaml of their own).
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  exclude:
    - '**/build/**'
    - '**/.dart_tool/**'
    - 'apps/*/android/**'
    - 'apps/*/ios/**'
    - '**/lib/l10n/generated/**'
    - '**/*.g.dart'
    - 'design/**'
    - 'docs/**'
    - 'node_modules/**'
    - '**/node_modules/**'
    - 'packages/design-tokens/**'
    - 'packages/contracts/**'
    - 'packages/i18n/**'
    - 'tools/**'

# `dart format` at the width the code is written in (an agent that formats without it rewraps whole files at 80 columns)
formatter:
  page_width: 150

linter:
  rules:
    - avoid_print
    - prefer_final_locals
    - prefer_single_quotes
    - sort_child_properties_last
    - unawaited_futures
    - use_key_in_widget_constructors
    - always_declare_return_types
    - require_trailing_commas
